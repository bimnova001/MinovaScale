<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-label="Capture pipeline">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3d5a7a"/>
    </marker>
  </defs>
  <rect width="1000" height="330" rx="18" fill="#0b0e14"/>

  <!-- game window -->
  <rect x="20" y="125" width="180" height="80" rx="10" fill="#101623" stroke="#2a3a52" stroke-width="2"/>
  <text x="110" y="152" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#e5effc">Game window</text>
  <text x="110" y="176" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#7d93ad">force-res: render at 720p</text>

  <!-- capture backends -->
  <rect x="255" y="55" width="215" height="76" rx="10" fill="#101623" stroke="#2a3a52" stroke-width="2"/>
  <text x="362" y="82" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#e5effc">WGC window capture</text>
  <text x="362" y="105" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#7d93ad">occlusion-immune (overlay OK)</text>

  <rect x="255" y="199" width="215" height="76" rx="10" fill="#101623" stroke="#2a3a52" stroke-width="2"/>
  <text x="362" y="226" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#e5effc">DDA desktop duplication</text>
  <text x="362" y="249" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#7d93ad">fallback: sees what is on screen</text>

  <!-- presenter -->
  <rect x="530" y="125" width="190" height="80" rx="10" fill="#101623" stroke="url(#acc)" stroke-width="2.5"/>
  <text x="625" y="152" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#e5effc">FSR 1 presenter (D3D11)</text>
  <text x="625" y="176" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#7d93ad">EASU → RCAS · crop = DWM bounds</text>

  <!-- outputs -->
  <rect x="780" y="55" width="200" height="76" rx="10" fill="#101623" stroke="#2a3a52" stroke-width="2"/>
  <text x="880" y="82" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#e5effc">Overlay (direct display)</text>
  <text x="880" y="105" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#7d93ad">click-through · topmost · 1:1</text>

  <rect x="780" y="199" width="200" height="76" rx="10" fill="#101623" stroke="#2a3a52" stroke-width="2"/>
  <text x="880" y="226" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#e5effc">Side window</text>
  <text x="880" y="249" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#7d93ad">fallback mode</text>

  <!-- arrows -->
  <g stroke="#3d5a7a" stroke-width="2.5" fill="none" marker-end="url(#arr)">
    <path d="M200 150 H230 Q245 150 245 120 V95 Q245 93 250 93"/>
    <path d="M200 180 H230 Q245 180 245 210 V237 Q245 237 250 237"/>
    <path d="M470 93 H487 Q505 93 505 120 V150 Q505 165 520 165 H525"/>
    <path d="M470 237 H487 Q505 237 505 210 V180 Q505 165 520 165"/>
    <path d="M720 140 Q745 140 745 115 V95 Q745 93 750 93 H775"/>
    <path d="M720 190 Q745 190 745 215 V237 Q745 237 750 237 H775"/>
  </g>

  <text x="500" y="315" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#5f758c">the game always renders its own frames — we only capture and reconstruct (no binary/injection) · latency ≈ 1–2 frames</text>
</svg>
